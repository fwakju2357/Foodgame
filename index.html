<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓国料理 Ideal World Cup - 桜デザイン</title>
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans JP', sans-serif;
        }

        /* 🌸 사쿠라 핑크 배경 & 은은한 꽃잎 은하수 느낌 */
        body {
            background-color: #fff4f6;
            background-image: 
                radial-gradient(#ffd0db 1.5px, transparent 1.5px), 
                radial-gradient(#ffd0db 1.5px, #fff4f6 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #2c2224;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* 전체 컨테이너 크기 대폭 확대 (900px -> 1100px) */
        .container {
            text-align: center;
            width: 100%;
            max-width: 1100px;
        }
        
        /* 배지 & 타이틀 크기 확대 */
        .title-badge {
            display: inline-block;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #e06d88;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: #ffe3e9;
            padding: 6px 18px;
            border-radius: 30px;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 24px;
            color: #4a2830;
            letter-spacing: -0.5px;
        }

        /* 1. 시작 화면 박스 크기 확대 */
        .select-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 70px 50px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(224, 109, 136, 0.12);
            border: 2px solid #ffd4de;
        }
        .select-box p {
            color: #6e5258;
            margin-bottom: 40px;
            font-size: 1.25rem;
            font-weight: 500;
        }
        
        /* 버튼 크기 확대 */
        .btn-start {
            display: inline-block;
            padding: 20px 64px;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #ff85a2 0%, #e05275 100%);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(224, 82, 117, 0.35);
        }
        .btn-start:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(224, 82, 117, 0.45);
        }

        /* 2. 게임 진행 화면 */
        .game-box {
            display: none;
        }
        .round-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 30px;
            color: #e05275;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }
        .match-container {
            display: flex;
            gap: 32px;
            justify-content: center;
        }

        /* 카드 박스 크기 확대 */
        .card {
            flex: 1;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #ffdae2;
            box-shadow: 0 12px 32px rgba(224, 109, 136, 0.1);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(224, 82, 117, 0.2);
            border-color: #ff85a2;
        }

        /* 이미지 박스 크기 대폭 확대 (240px -> 360px) */
        .img-placeholder {
            width: 100%;
            height: 360px;
            background-color: #fff0f3;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #c9526f;
            margin-bottom: 24px;
            word-break: break-all;
            padding: 20px;
            border: 2px dashed #ffb8c8;
        }

        /* 일본어 이름 글자 크기 확대 (1.5rem -> 2.1rem) */
        .japanese-name {
            font-size: 2.1rem;
            font-weight: 900;
            color: #3b2026;
            line-height: 1.3;
        }

        /* 3. 최종 결과 화면 */
        .result-box {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(224, 109, 136, 0.12);
            border: 2px solid #ffd4de;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .match-container {
                flex-direction: column;
                gap: 24px;
            }
            .card {
                padding: 20px;
            }
            .img-placeholder {
                height: 240px;
                font-size: 1rem;
            }
            .japanese-name {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 게임 시작 화면 -->
        <div id="setup-screen" class="select-box">
            <span class="title-badge">🌸 CHERRY BLOSSOM EDITION 🌸</span>
            <h1>韓国料理 Ideal World Cup</h1>
            <p>16種類の中から、あなたの「1番好きな韓国料理」を選んでください！</p>
            <button class="btn-start" onclick="startGame(16)">GAME START</button>
        </div>

        <!-- 2. 게임 진행 화면 -->
        <div id="game-screen" class="game-box">
            <h2 id="round-info" class="round-title">ROUND OF 16</h2>
            <div class="match-container">
                <!-- 왼쪽 선택지 -->
                <div class="card" onclick="selectCandidate(0)">
                    <div id="img-0" class="img-placeholder">이미지 파일명</div>
                    <div id="name-0" class="japanese-name">일본어 이름</div>
                </div>
                <!-- 오른쪽 선택지 -->
                <div class="card" onclick="selectCandidate(1)">
                    <div id="img-1" class="img-placeholder">이미지 파일명</div>
                    <div id="name-1" class="japanese-name">일본어 이름</div>
                </div>
            </div>
        </div>

        <!-- 3. 최종 결과 화면 -->
        <div id="result-screen" class="result-box">
            <span class="title-badge">🌸 WINNER 🌸</span>
            <h1 style="margin-bottom: 24px;">🏆 CHAMPION 🏆</h1>
            <div style="margin: 30px 0;">
                <div id="winner-img" class="img-placeholder" style="height: 380px; max-width: 520px; margin: 0 auto 24px auto;"></div>
                <div id="winner-name" class="japanese-name" style="font-size: 2.6rem;"></div>
            </div>
            <button class="btn-start" onclick="location.reload()" style="margin-top: 10px;">RESTART</button>
        </div>
    </div>

    <script>
        // 16가지 음식 데이터 목록
        const foods = [
            { img: "samgyeopsal.jpg", jp: "サムギョプサル" },
            { img: "chicken.jpg", jp: "チキン" },
            { img: "tteokbokki.jpg", jp: "トッポッキ" },
            { img: "kimchi_jjigae.jpg", jp: "キムチチゲ" },
            { img: "bibimbap.jpg", jp: "ビビンバ" },
            { img: "bulgogi.jpg", jp: "プルコギ" },
            { img: "cheese_dakgalbi.jpg", jp: "チーズタッカルビ" },
            { img: "gimbap.jpg", jp: "キンパ" },
            { img: "ramyeon.jpg", jp: "ラーメン" },
            { img: "naengmyeon.jpg", jp: "冷麺" },
            { img: "jajangmyeon.jpg", jp: "ジャージャー麺" },
            { img: "sundubu_jjigae.jpg", jp: "スンドゥブチゲ" },
            { img: "dakgalbi.jpg", jp: "タッカルビ" },
            { img: "japchae.jpg", jp: "チャプチェ" },
            { img: "budae_jjigae.jpg", jp: "プデチゲ" },
            { img: "kimchi.jpg", jp: "キムチ" }
        ];

        let currentCandidates = [];
        let nextRoundCandidates = [];
        let currentMatchIndex = 0;

        // 배열 무작위 섞기
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // 게임 시작
        function startGame(roundCount) {
            currentCandidates = shuffle([...foods]).slice(0, roundCount);
            nextRoundCandidates = [];
            currentMatchIndex = 0;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            updateMatch();
        }

        // 대진 화면 업데이트
        function updateMatch() {
            const totalMatches = currentCandidates.length / 2;
            const matchNum = (currentMatchIndex / 2) + 1;
            
            let roundText = "";
            if (currentCandidates.length === 2) {
                roundText = "FINAL MATCH";
            } else {
                roundText = `ROUND OF ${currentCandidates.length} (${matchNum}/${totalMatches})`;
            }
            
            document.getElementById('round-info').innerText = roundText;

            const c1 = currentCandidates[currentMatchIndex];
            const c2 = currentCandidates[currentMatchIndex + 1];

            document.getElementById('img-0').innerText = c1.img;
            document.getElementById('name-0').innerText = c1.jp;

            document.getElementById('img-1').innerText = c2.img;
            document.getElementById('name-1').innerText = c2.jp;
        }

        // 선택 처리
        function selectCandidate(index) {
            const selected = currentCandidates[currentMatchIndex + index];
            nextRoundCandidates.push(selected);
            currentMatchIndex += 2;

            if (currentMatchIndex >= currentCandidates.length) {
                if (nextRoundCandidates.length === 1) {
                    showResult(nextRoundCandidates[0]);
                } else {
                    currentCandidates = nextRoundCandidates;
                    nextRoundCandidates = [];
                    currentMatchIndex = 0;
                    updateMatch();
                }
            } else {
                updateMatch();
            }
        }

        // 결과 화면 표시
        function showResult(winner) {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            document.getElementById('winner-img').innerText = winner.img;
            document.getElementById('winner-name').innerText = winner.jp;
        }
    </script>
</body>
</html>
