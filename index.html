<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓国料理 Ideal World Cup</title>
    <!-- Google Fonts: Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans JP', sans-serif;
        }

        /* 🌸 배경: 오프화이트 칼라 & 벚꽃 애니메이션 영역 */
        body {
            background-color: #fcfbf9;
            color: #2c2224;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌸 떨어지는 벚꽃잎 애니메이션 */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffc2d1 0%, #ffe3e9 100%);
            border-radius: 150% 0 150% 0;
            opacity: 0.7;
            animation: fall linear infinite, sway ease-in-out infinite;
        }

        @keyframes fall {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        @keyframes sway {
            0% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(50px) rotate(180deg); }
            100% { transform: translateX(0) rotate(360deg); }
        }

        /* 전체 컨테이너 */
        .container {
            text-align: center;
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 1;
        }

        /* 1. 첫 페이지 (GAME START 버튼만 위치) */
        .select-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 80px 50px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(224, 109, 136, 0.08);
            border: 2px solid #ffd4de;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 버튼 디자인 */
        .btn-start {
            display: inline-block;
            padding: 22px 72px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #ff85a2 0%, #e05275 100%);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(224, 82, 117, 0.35);
        }
        .btn-start:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 30px rgba(224, 82, 117, 0.45);
        }

        /* 2. 게임 진행 화면 */
        .game-box {
            display: none;
        }
        .round-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 30px;
            color: #e05275;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }
        .match-container {
            display: flex;
            gap: 32px;
            justify-content: center;
        }

        /* 카드 박스 */
        .card {
            flex: 1;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            border: 2px solid #ffdae2;
            box-shadow: 0 12px 32px rgba(224, 109, 136, 0.08);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(224, 82, 117, 0.18);
            border-color: #ff85a2;
        }

        /* 🖼️ 이미지 스타일 */
        .food-img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 24px;
            border: 2px solid #ffdae2;
        }

        /* 일본어 이름 */
        .japanese-name {
            font-size: 2.1rem;
            font-weight: 900;
            color: #3b2026;
            line-height: 1.3;
        }

        /* 3. 최종 결과 화면 */
        .result-box {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(224, 109, 136, 0.08);
            border: 2px solid #ffd4de;
        }

        /* 🌸 결과 멘트 박스 스타일 */
        .desc-box {
            background-color: #fff4f6;
            border-radius: 16px;
            padding: 20px 30px;
            max-width: 850px;
            margin: 25px auto 35px auto;
            border: 1px solid #ffdae2;
            font-size: 1.45rem;
            font-weight: 700;
            color: #4a2830;
            line-height: 1.4;
            box-shadow: 0 4px 15px rgba(224, 109, 136, 0.05);
            word-break: keep-all;
        }
        
        @media (max-width: 768px) {
            .match-container {
                flex-direction: column;
                gap: 24px;
            }
            .card {
                padding: 20px;
            }
            .food-img {
                height: 240px;
            }
            .japanese-name {
                font-size: 1.6rem;
            }
            .btn-start {
                padding: 18px 50px;
                font-size: 1.25rem;
            }
            .desc-box {
                font-size: 1.15rem;
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 🌸 벚꽃잎 배경 -->
    <div class="sakura-container" id="sakura-container"></div>

    <div class="container">
        <!-- 1. 첫 페이지 (GAME START 버튼만 위치) -->
        <div id="setup-screen" class="select-box">
            <button class="btn-start" onclick="startGame(16)">GAME START</button>
        </div>

        <!-- 2. 게임 진행 화면 -->
        <div id="game-screen" class="game-box">
            <h2 id="round-info" class="round-title">ROUND OF 16</h2>
            <div class="match-container">
                <!-- 왼쪽 선택지 -->
                <div class="card" onclick="selectCandidate(0)">
                    <img id="img-0" class="food-img" src="" alt="Food Image">
                    <div id="name-0" class="japanese-name">일본어 이름</div>
                </div>
                <!-- 오른쪽 선택지 -->
                <div class="card" onclick="selectCandidate(1)">
                    <img id="img-1" class="food-img" src="" alt="Food Image">
                    <div id="name-1" class="japanese-name">일본어 이름</div>
                </div>
            </div>
        </div>

        <!-- 3. 최종 결과 화면 -->
        <div id="result-screen" class="result-box">
            <h1 style="margin-bottom: 24px; font-size: 2.5rem; color: #e05275;">🏆 CHAMPION 🏆</h1>
            <div style="margin: 30px 0;">
                <img id="winner-img" class="food-img" style="height: 380px; max-width: 520px; margin: 0 auto 24px auto; display: block;" src="" alt="Winner Image">
                <div id="winner-name" class="japanese-name" style="font-size: 2.6rem; margin-bottom: 15px;"></div>
                <!-- 일본어 한 줄 결과 멘트 출력 박스 -->
                <div id="winner-desc" class="desc-box"></div>
            </div>
            <button class="btn-start" onclick="location.reload()" style="margin-top: 10px;">RESTART</button>
        </div>
    </div>

    <script>
        // 16가지 음식 데이터 (제시해주신 일본어 원본 적용)
        const foods = [
            { 
                img: "samgyeopsal.AVIF", 
                jp: "サムギョプサル",
                desc: "気分が沈んだ時は、とりあえず肉から食べる素直でストレートな実行派！" 
            },
            { 
                img: "chicken.JPG", 
                jp: "チキン",
                desc: "夜10時になると本能が目を覚ます、夜食の代名詞。" 
            },
            { 
                img: "tteokbokki.JPG", 
                jp: "トッポッキ",
                desc: "ストレスが溜まったら辛さで脳をリセットする刺激ラバー！" 
            },
            { 
                img: "kimchi_jjigae.JPG", 
                jp: "キムチチゲ",
                desc: "トレンドより「慣れ親しんだ味」が好き！いつも側に置いておきたい安心の保証付き。" 
            },
            { 
                img: "bibimbap.JPG", 
                jp: "ビビンバ",
                desc: "十人十色な人々も一つにまとめる人間接着剤！" 
            },
            { 
                img: "bulgogi.WEBP", 
                jp: "プルコギ",
                desc: "好き嫌いゼロ！老若男女みんなから愛される万能人気者。" 
            },
            { 
                img: "cheese_dakgalbi.JPG", 
                jp: "チーズタッカルビ",
                desc: "クラシックにトレンドをひとさじ！センスあふれるトレンドセッター。" 
            },
            { 
                img: "gimbap.JPG", 
                jp: "キンパ",
                desc: "どこでも200%役割を果たす万能パーフェクト主義者！" 
            },
            { 
                img: "ramyeon.JPG", 
                jp: "ラーメン",
                desc: "複雑な悩みはNO！3分で幸せになれる明快な人。" 
            },
            { 
                img: "naengmyeon.JPG", 
                jp: "冷麺",
                desc: "周りに何と言われようと、自分だけのマイウェイをクールに行くマイペース。" 
            },
            { 
                img: "jajangmyeon.jpg", 
                jp: "ジャジャンミョン",
                desc: "特別な日、嬉しい日ごとに真っ先に思い浮かぶ思い出コレクター。" 
            },
            { 
                img: "sundubu_jjigae.JPG", 
                jp: "スンドゥブチゲ",
                desc: "見た目は柔らかいのに中身は溶岩のように熱い情熱派！" 
            },
            { 
                img: "samgyetang.JPG", 
                jp: "サムゲタン",
                desc: "疲れた人々に エネルギーを充電してくれる心強いヒーラー！" 
            },
            { 
                img: "japchae.jpg", 
                jp: "チャプチェ",
                desc: "小さなディテール一つ見逃さない、真心に満ちた繊細さの極み！" 
            },
            { 
                img: "budae_jjigae.JPG", 
                jp: "プデチゲ",
                desc: "あれこれ混ざり合っても最高の結果を作り出す融合型天才！" 
            },
            { 
                img: "kimchi.JPG", 
                jp: "キムチ",
                desc: "どんな場でもいないと寂しい、欠かせない名脇役（シーンスチーラー）！" 
            }
        ];

        let currentCandidates = [];
        let nextRoundCandidates = [];
        let currentMatchIndex = 0;

        // 🌸 벚꽃잎 동적 생성
        function createSakuraPetals() {
            const container = document.getElementById('sakura-container');
            const petalCount = 25;

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                
                const size = Math.random() * 12 + 10;
                const left = Math.random() * 100;
                const fallDuration = Math.random() * 6 + 6;
                const swayDuration = Math.random() * 3 + 2;
                const delay = Math.random() * 8;

                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.4}px`;
                petal.style.left = `${left}%`;
                petal.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
                petal.style.animationDelay = `${delay}s, ${delay}s`;

                container.appendChild(petal);
            }
        }

        window.onload = createSakuraPetals;

        // 배열 무작위 섞기
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // 게임 시작
        function startGame(roundCount) {
            currentCandidates = shuffle([...foods]).slice(0, roundCount);
            nextRoundCandidates = [];
            currentMatchIndex = 0;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            updateMatch();
        }

        // 대진 화면 업데이트
        function updateMatch() {
            const totalMatches = currentCandidates.length / 2;
            const matchNum = (currentMatchIndex / 2) + 1;
            
            let roundText = "";
            if (currentCandidates.length === 2) {
                roundText = "FINAL MATCH";
            } else {
                roundText = `ROUND OF ${currentCandidates.length} (${matchNum}/${totalMatches})`;
            }
            
            document.getElementById('round-info').innerText = roundText;

            const c1 = currentCandidates[currentMatchIndex];
            const c2 = currentCandidates[currentMatchIndex + 1];

            document.getElementById('img-0').src = c1.img;
            document.getElementById('name-0').innerText = c1.jp;

            document.getElementById('img-1').src = c2.img;
            document.getElementById('name-1').innerText = c2.jp;
        }

        // 선택 처리
        function selectCandidate(index) {
            const selected = currentCandidates[currentMatchIndex + index];
            nextRoundCandidates.push(selected);
            currentMatchIndex += 2;

            if (currentMatchIndex >= currentCandidates.length) {
                if (nextRoundCandidates.length === 1) {
                    showResult(nextRoundCandidates[0]);
                } else {
                    currentCandidates = nextRoundCandidates;
                    nextRoundCandidates = [];
                    currentMatchIndex = 0;
                    updateMatch();
                }
            } else {
                updateMatch();
            }
        }

        // 결과 화면 표시
        function showResult(winner) {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            document.getElementById('winner-img').src = winner.img;
            document.getElementById('winner-name').innerText = winner.jp;
            document.getElementById('winner-desc').innerText = winner.desc;
        }
    </script>
</body>
</html>
