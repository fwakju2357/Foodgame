<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 음식 이상형 월드컵</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans JP', 'Noto Sans KR', sans-serif;
        }
        body {
            background-color: #f7f6f2; /* 감성적인 오프화이트/크림 베이지 배경 */
            color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 860px;
        }
        
        /* 메인 타이틀 */
        .title-badge {
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #8c857b;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 500;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        /* 1. 스타트 화면 */
        .select-box {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid #eae7e1;
        }
        .select-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        /* 버튼 스타일 */
        .btn-start {
            display: inline-block;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            border: none;
            border-radius: 50px;
            background-color: #2b2b2b;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-start:hover {
            background-color: #4a4a4a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        /* 2. 게임 진행 화면 */
        .game-box {
            display: none;
        }
        .round-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #2b2b2b;
            letter-spacing: 1px;
        }
        .match-container {
            display: flex;
            gap: 24px;
            justify-content: center;
        }
        .card {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #eae7e1;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.08);
            border-color: #d1cdb8;
        }
        .img-placeholder {
            width: 100%;
            height: 240px;
            background-color: #f2efe9;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #7a756c;
            margin-bottom: 20px;
            word-break: break-all;
            padding: 15px;
            border: 1px dashed #d1cdb8;
        }
        .japanese-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.3;
        }

        /* 3. 최종 결과 화면 */
        .result-box {
            display: none;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid #eae7e1;
        }
        
        @media (max-width: 640px) {
            .match-container {
                flex-direction: column;
            }
            .card {
                padding: 16px;
            }
            .img-placeholder {
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="setup-screen" class="select-box">
            <span class="title-badge">FOOD WORLD CUP</span>
            <h1>韓国料理 Ideal World Cup</h1>
            <p>16 종류의 대표 한국 음식 중 최애 음식을 골라주세요!</p>
            <button class="btn-start" onclick="startGame(16)">GAME START</button>
        </div>

        <div id="game-screen" class="game-box">
            <h2 id="round-info" class="round-title">ROUND 16</h2>
            <div class="match-container">
                <div class="card" onclick="selectCandidate(0)">
                    <div id="img-0" class="img-placeholder">이미지 파일명</div>
                    <div id="name-0" class="japanese-name">일본어 이름</div>
                </div>
                <div class="card" onclick="selectCandidate(1)">
                    <div id="img-1" class="img-placeholder">이미지 파일명</div>
                    <div id="name-1" class="japanese-name">일본어 이름</div>
                </div>
            </div>
        </div>

        <div id="result-screen" class="result-box">
            <span class="title-badge">WINNER</span>
            <h1 style="margin-bottom: 20px;">🏆 CHAMPION 🏆</h1>
            <div style="margin: 30px 0;">
                <div id="winner-img" class="img-placeholder" style="height: 280px; max-width: 400px; margin: 0 auto 20px auto;"></div>
                <div id="winner-name" class="japanese-name" style="font-size: 2rem;"></div>
            </div>
            <button class="btn-start" onclick="location.reload()" style="margin-top: 10px;">RESTART</button>
        </div>
    </div>

    <script>
        // 16가지 음식 데이터 목록
        const foods = [
            { img: "samgyeopsal.jpg", jp: "サムギョプサル" },
            { img: "chicken.jpg", jp: "チキン" },
            { img: "tteokbokki.jpg", jp: "トッポッキ" },
            { img: "kimchi_jjigae.jpg", jp: "キムチチゲ" },
            { img: "bibimbap.jpg", jp: "ビビンバ" },
            { img: "bulgogi.jpg", jp: "プルコギ" },
            { img: "cheese_dakgalbi.jpg", jp: "チーズタッカルビ" },
            { img: "gimbap.jpg", jp: "キンパ" },
            { img: "ramyeon.jpg", jp: "ラーメン" },
            { img: "naengmyeon.jpg", jp: "冷麺" },
            { img: "jajangmyeon.jpg", jp: "ジャージャー麺" },
            { img: "sundubu_jjigae.jpg", jp: "スンドゥブチゲ" },
            { img: "dakgalbi.jpg", jp: "タッカルビ" },
            { img: "japchae.jpg", jp: "チャプチェ" },
            { img: "budae_jjigae.jpg", jp: "プデチゲ" },
            { img: "kimchi.jpg", jp: "キムチ" }
        ];

        let currentCandidates = [];
        let nextRoundCandidates = [];
        let currentMatchIndex = 0;

        // 배열 무작위 섞기
        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // 게임 시작
        function startGame(roundCount) {
            currentCandidates = shuffle([...foods]).slice(0, roundCount);
            nextRoundCandidates = [];
            currentMatchIndex = 0;

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            updateMatch();
        }

        // 대진 화면 업데이트
        function updateMatch() {
            const totalMatches = currentCandidates.length / 2;
            const matchNum = (currentMatchIndex / 2) + 1;
            
            let roundText = "";
            if (currentCandidates.length === 2) {
                roundText = "FINAL MATCH";
            } else {
                roundText = `ROUND OF ${currentCandidates.length} (${matchNum}/${totalMatches})`;
            }
            
            document.getElementById('round-info').innerText = roundText;

            const c1 = currentCandidates[currentMatchIndex];
            const c2 = currentCandidates[currentMatchIndex + 1];

            document.getElementById('img-0').innerText = c1.img;
            document.getElementById('name-0').innerText = c1.jp;

            document.getElementById('img-1').innerText = c2.img;
            document.getElementById('name-1').innerText = c2.jp;
        }

        // 선택 처리
        function selectCandidate(index) {
            const selected = currentCandidates[currentMatchIndex + index];
            nextRoundCandidates.push(selected);
            currentMatchIndex += 2;

            if (currentMatchIndex >= currentCandidates.length) {
                if (nextRoundCandidates.length === 1) {
                    showResult(nextRoundCandidates[0]);
                } else {
                    currentCandidates = nextRoundCandidates;
                    nextRoundCandidates = [];
                    currentMatchIndex = 0;
                    updateMatch();
                }
            } else {
                updateMatch();
            }
        }

        // 결과 화면 표시
        function showResult(winner) {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            document.getElementById('winner-img').innerText = winner.img;
            document.getElementById('winner-name').innerText = winner.jp;
        }
    </script>
</body>
</html>
